[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [".venv", "venv", "helpers"]

[tool.ruff.lint]
# Default ruleset (pyflakes + pycodestyle errors): catches real defects
# (undefined names, unused imports/variables, syntax) without style churn.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A deadlocked writer/SSE test must fail, not hang the CI job for hours.
timeout = 180
